name: Build seffignoz RomM image

on:
  push:
    branches: [seffignoz/hide-player-navigation]
    paths:
      - frontend/**
      - docker/Dockerfile.seffignoz
      - .github/workflows/build-seffignoz.yaml
  workflow_dispatch:

concurrency:
  group: romm-custom-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish patched image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.seffignoz
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/seffignoz/romm:5.0.0-player-nav-fix
            ghcr.io/seffignoz/romm:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/seffignoz/romm
          cache-from: type=gha
          cache-to: type=gha,mode=max
